name: Release Management
on:
  pull_request:
    types:
      - opened
      - labeled
      - unlabeled
      - synchronize
      - reopened
  milestone:
    types:
      - closed
permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
jobs:
  release-management:
    name: Release Management
    secrets: inherit
    uses: WyriHaximus/github-workflows/.github/workflows/github-action-release-management.yaml@62425f292ed39e245af475d0d99687e008225d60 # v1.0.4
    with:
      milestone: ${{ github.event.milestone.title }}
      description: ${{ github.event.milestone.description }}
      mustCreateCommit: true
      reTagOCIImage: true
      preReleaseScript: |
        sed -i 's/:master/:${{ github.event.milestone.title }}/g' action.yml
        cat action.yml
        git add action.yml
