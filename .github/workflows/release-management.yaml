name: Release Management
on:
  pull_request:
    types:
      - opened
      - labeled
      - unlabeled
      - synchronize
      - reopened
  milestone:
    types:
      - closed
permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
jobs:
  release-management:
    name: Release Management
    secrets: inherit
    uses: WyriHaximus/github-workflows/.github/workflows/github-action-release-management.yaml@6988c81b0977eb30959fe16a3457931373523d84 # v1.1.3
    with:
      milestone: ${{ github.event.milestone.title }}
      description: ${{ github.event.milestone.description }}
      mustCreateCommit: true
      reTagOCIImage: true
      preReleaseScript: |
        sed -i 's/:master/:${{ github.event.milestone.title }}/g' action.yml
        cat action.yml
        git add action.yml
